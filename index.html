<!DOCTYPE html>

  <title>HW部材集計アプリ</title>

  <!-- JS無効でも転送できるようにmeta refreshを保険で入れる -->

  <script>
    // JSが有効なら即時転送（検索文字列とハッシュも引き継ぐ。履歴は汚さないようreplaceを使う）
    location.replace('./hw-parts-calculator.html' + location.search + location.hash);
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px; text-align: center; line-height: 1.8;">
