  }

  // ---- 文章 → プレビュー ----
  let vcAlts = null;   // 直前の音声認識の候補 {text, list}
  function vcStatus(msg, cls){ const s = $("vcStatus"); s.textContent = msg || ""; s.className = "vc-st" + (cls ? " " + cls : ""); }
  function voiceInterpret(){
    const raw = $("vcText").value.replace(/\s+$/g, "");
    if(!raw.trim()){ vcStatus("話した内容が空です。話すか、文字で入れてね。", "w"); return; }
    const input = vcAlts && vcAlts.text === raw.trim() ? vcAlts.list : raw;
    const res = VoiceParser.parseVoice(input, materials);
    const its = res.items.slice(0, 300);
    if(!its.length){ vcStatus("部材と数量が見つかりませんでした。「エルボ20Aを3個使った」のように言ってみてね。", "w"); return; }
    const items = its.map(x => ({ word: x.name, kind: x.kind, kindFrom: x.kindFrom, qty: x.qty, unit: x.unit, unitKind: x.unitKind, id: x.id, status: x.status, cands: x.cands, corr: x.corr, corrItem: x.corrItem, picked: false, learn: false, kindEdited: false }));
    const date = todayStr(), memo = "声で入力";
    const obj = { type: "hw-parts-ops", version: 1, id: "voice-" + date + "-" + voiceHash(res.text), date, memo, ops: items.map(voiceOp) };
    const p = parseOps(JSON.stringify(obj), JSON.stringify(obj).length);
    if(p.err){ opsErr(p.err); return; }
    p.file.voice = { text: res.text, alt: res.alt, altCount: res.altCount, items };
    vcStatus("");
    handleOpsFile(p.file);
  }
  $("vcGo").addEventListener("click", voiceInterpret);

  // ---- マイク（Web Speech API。ここだけネット必須。使えない時は理由を出して無効にする）----
  (function(){
    const btn = $("vcMic"), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, listening = false;
    const base = "🎤 声で入力";
    const setBtn = () => { btn.textContent = listening ? "■ とめる" : base; btn.classList.toggle("rec", listening); };
    function avail(){
      if(!SR){ btn.disabled = true; vcStatus("この端末のブラウザは、声の自動入力ボタンに対応していません。キーボードのマイク🎤で話すか、文字で入れてね。"); return false; }
      return true;
    }
    function netNote(){ if(SR && navigator.onLine === false) vcStatus("今はネットにつながっていません。「声で入力」ボタンはネットが必要です。キーボードのマイク🎤なら電波がなくても使えます（言語パックが入っていれば）。", "w"); else if(SR && $("vcStatus").classList.contains("w") && /ネットにつながっていません/.test($("vcStatus").textContent)) vcStatus(""); }
    window.addEventListener("offline", netNote); window.addEventListener("online", netNote);
    avail();
    btn.addEventListener("click", () => {
      if(listening && rec){ try{ rec.stop(); }catch(e){} return; }
      if(!avail()) return;
      if(navigator.onLine === false){ netNote(); return; }
      let got = null, err = "";
      try{
        rec = new SR(); rec.lang = "ja-JP"; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
      }catch(e){ vcStatus("声の入力を始められませんでした。キーボードのマイク🎤を使ってね。", "w"); return; }
      rec.onstart = () => { listening = true; setBtn(); vcStatus("聞いています…話してね"); };
      rec.onresult = ev => {
        const fin = [], interim = [];
        for(let i = 0; i < ev.results.length; i++){ const r = ev.results[i]; (r.isFinal ? fin : interim).push(r); }
        if(interim.length && !fin.length) vcStatus("聞き取り中: " + interim.map(r => r[0].transcript).join(""));
        if(fin.length){
          const n = Math.min(5, Math.max.apply(null, fin.map(r => r.length)));
          const list = [];
          for(let k = 0; k < n; k++){ const t = fin.map(r => (r[k] || r[0]).transcript).join(""); if(t.trim() && !list.includes(t)) list.push(t); }
          got = list;
        }
      };
      rec.onerror = ev => {
        const c = ev && ev.error;
        err = c === "not-allowed" || c === "service-not-allowed" ? "マイクの許可がありません。ブラウザのマイク許可をオンにするか、キーボードのマイク🎤を使ってね。"
          : c === "network" ? "ネットにつながらないため、声のボタンは使えません。キーボードのマイク🎤で話してね。"
          : c === "no-speech" ? "声が聞こえませんでした。もう一度ボタンを押して話してね。"
          : c === "audio-capture" ? "マイクが見つかりません。"
          : c === "aborted" ? "" : "うまく聞き取れませんでした（" + (c || "不明") + "）。";
      };
      rec.onend = () => {
        listening = false; setBtn(); rec = null;
        if(got && got.length){
          const ta = $("vcText"), had = ta.value.trim();
          const best = VoiceParser.parseVoice(got, materials), text = best.items.length ? best.text : got[0];
          ta.value = had ? ta.value.replace(/\s+$/g, "") + "\n" + text : text;
          vcAlts = had ? null : { text: text.trim(), list: got };
          vcStatus("聞き取りました。内容を見て、よければ「解釈する」を押してね。", "ok");
        }else vcStatus(err || "聞き取れませんでした。もう一度どうぞ。", err ? "w" : "");
      };
      try{ rec.start(); }catch(e){ listening = false; setBtn(); vcStatus("声の入力を始められませんでした。", "w"); }
    });
  })();

  loadState();   // v0.5: 保存済みの作業状態（部材・数量・税率）を復元してから描画
  render();
</script>
</body>
